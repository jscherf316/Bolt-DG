<!doctype html>
<html><head><style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
  /* The client clamps embedded browsers to 60x60 minimum (WINDOW_MIN_SIZE),
     so the visible button is a 36px strip at the TOP of the square and the
     rest of the page stays transparent. NB: the transparent remainder still
     sits inside the browser rect and intercepts clicks -- the dead zone is
     the 24px directly below the button. */
  .btn {
    width: 100%; height: 36px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #4b402f 0%, #3e352a 100%);
    color: #f0d493;
    border: 1px solid #967a4a;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.45);
  }
  .btn:hover {
    background: linear-gradient(180deg, #5a4d38 0%, #4b402f 100%);
    color: #ffcf6b;
  }
</style></head><body>
  <div class="btn" id="btn">CTRL</div>
  <script>
    // Same pattern the devplugin uses on a native Bolt window:
    //   mousedown → arm, record position
    //   mousemove past a small threshold → hand control to Bolt for a drag
    //   mouseup without exceeding threshold → treat as click
    // Deferring start-reposition until after real movement is the key —
    // calling it in mousedown makes Bolt capture the mouse before mouseup
    // ever fires in the HTML.
    const btn = document.getElementById("btn");
    const DRAG_THRESHOLD = 4;
    let held = false, startX = 0, startY = 0, dragged = false;

    btn.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      held = true;
      dragged = false;
      startX = e.screenX;
      startY = e.screenY;
    });
    btn.addEventListener("mousemove", (e) => {
      if (!held || dragged) return;
      if (Math.abs(e.screenX - startX) >= DRAG_THRESHOLD ||
          Math.abs(e.screenY - startY) >= DRAG_THRESHOLD) {
        dragged = true;
        fetch("https://bolt-api/start-reposition?h=0&v=0").catch(() => {});
      }
    });
    btn.addEventListener("mouseup", (e) => {
      if (e.button !== 0) return;
      const wasClick = held && !dragged;
      held = false;
      if (wasClick) {
        fetch("https://bolt-api/send-message", { method: "POST", body: "open" }).catch(() => {});
      }
    });
    // If the pointer leaves the button mid-drag/click, cancel arming.
    btn.addEventListener("mouseleave", () => { if (!dragged) held = false; });

    // ---- hiscores sidecar --------------------------------------------------
    // This always-on page is the plugin's only network leg (the Lua sandbox
    // has no sockets). Plugin sends "hs_fetch:<name>", we reply "hs_ok:<csv>"
    // or "hs_err:<detail>" after retries.
    //
    // CORS, measured not assumed (2026-07-28, devtools on this page):
    //   "Access to fetch at 'secure.runescape.com/...' from origin 'null'
    //    has been blocked by CORS policy: No 'Access-Control-Allow-Origin'"
    // A plugin:// page has an OPAQUE origin ("null"), and Jagex sends no ACAO
    // header at all, so nothing but a wildcard/null ACAO can ever satisfy it.
    // The request itself succeeds (200) -- only reading the body is blocked.
    // main.cxx's "re-run with --disable-web-security" comment is dead code:
    // no build actually appends the switch. So the direct fetch cannot work
    // on stock bolt, and a relay that adds the header is required.
    //
    // Surveyed alternatives: the RS wiki / Weird Gloop API send ACAO * but
    // expose no player stats (exchange, VOS, social only); RunePixels HAS
    // full per-skill levels but echoes ACAO only for its own origin, so a
    // null origin is refused. allorigins returns ACAO "null", which matches
    // our origin exactly -- verified end to end against the real endpoint.
    //
    // Direct is still tried FIRST so this self-heals for free if bolt ever
    // ships the switch (or adds a bolt-api fetch endpoint); the relay is the
    // fallback. hs_diag records which transport won.
    const HS_TRIES = 5, HS_RETRY_MS = 10000;
    const post = (body) =>
      fetch("https://bolt-api/send-message", { method: "POST", body }).catch(() => {});

    const TRANSPORTS = [
      { name: "direct", url: (n) =>
          "https://secure.runescape.com/m=hiscore/index_lite.ws?player=" + encodeURIComponent(n) },
      { name: "allorigins", url: (n) =>
          "https://api.allorigins.win/raw?url=" + encodeURIComponent(
            "https://secure.runescape.com/m=hiscore/index_lite.ws?player=" + encodeURIComponent(n)) },
    ];

    function hsTry(name, attempt, ti, errs) {
      if (ti >= TRANSPORTS.length) {
        if (attempt < HS_TRIES) {
          setTimeout(() => hsTry(name, attempt + 1, 0, []), HS_RETRY_MS);
        } else {
          post("hs_err:" + errs.join(" | "));
        }
        return;
      }
      const t = TRANSPORTS[ti];
      fetch(t.url(name))
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then((text) => {
          // A relay can answer 200 with an error page instead of the CSV;
          // require the shape (first line "rank,level,xp") before accepting.
          if (!/^\d+,\d+,\d+/.test(text)) throw new Error("not hiscores CSV");
          post("hs_ok:" + t.name + ":" + text);
        })
        .catch((err) => {
          errs.push(t.name + ": " + String((err && err.message) || err));
          hsTry(name, attempt, ti + 1, errs);
        });
    }

    function hsFetch(name, attempt) { hsTry(name, attempt, 0, []); }

    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "pluginMessage") return;
      let c = e.data.content;
      if (c instanceof Uint8Array) c = new TextDecoder().decode(c);
      else if (c instanceof ArrayBuffer) c = new TextDecoder().decode(new Uint8Array(c));
      if (typeof c !== "string") return;
      if (c.startsWith("hs_fetch:")) hsFetch(c.slice(9), 1);
    });

    // Announce readiness so the plugin knows sendmessage will be heard.
    post("ready");
  </script>
</body></html>
